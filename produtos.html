<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kullka WMS - Catálogo de Produtos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SDK do Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

  <!-- Cabeçalho -->
  <header class="bg-blue-700 text-white p-4 shadow-md">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold">📦 Kullka WMS</h1>
      <a href="index.html" class="text-sm bg-blue-800 hover:bg-blue-900 px-3 py-1.5 rounded-lg transition">← Voltar ao Painel</a>
    </div>
  </header>

  <main class="container mx-auto mt-8 p-4">
    <!-- Título e Filtros -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
      <div>
        <h2 class="text-2xl font-bold text-gray-800">Catálogo de Produtos</h2>
        <p class="text-sm text-gray-500">Consulte os itens cadastrados no seu banco de dados Supabase.</p>
      </div>
      
      <!-- Campo de Busca -->
      <div class="flex gap-2 w-full md:w-auto">
        <input type="text" id="searchInput" placeholder="Buscar por nome ou EAN..." class="border border-gray-300 p-2 rounded-lg w-full md:w-80 focus:ring-2 focus:ring-blue-500 focus:outline-none">
        <button onclick="carregarProdutos(1)" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-blue-700 transition">Buscar</button>
      </div>
    </div>

    <!-- Tabela de Produtos -->
    <div class="bg-white rounded-xl shadow-md border border-gray-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-50 border-b border-gray-200 text-xs font-semibold text-gray-600 uppercase tracking-wider">
              <th class="p-4">GTIN / EAN</th>
              <th class="p-4">Nome do Produto</th>
              <th class="p-4">Marca</th>
              <th class="p-4">Categoria</th>
            </tr>
          </thead>
          <tbody id="tabelaProdutos" class="divide-y divide-gray-200 text-sm">
            <tr>
              <td colspan="4" class="p-4 text-center text-gray-500">Carregando produtos...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Paginação -->
      <div class="p-4 bg-gray-50 border-t border-gray-200 flex justify-between items-center text-sm">
        <button id="btnAnterior" onclick="paginaAnterior()" class="bg-white border border-gray-300 text-gray-700 px-3 py-1.5 rounded-lg hover:bg-gray-100 disabled:opacity-50" disabled>Anterior</button>
        <span id="infoPagina" class="text-gray-600">Página 1</span>
        <button id="btnProxima" onclick="proximaPagina()" class="bg-white border border-gray-300 text-gray-700 px-3 py-1.5 rounded-lg hover:bg-gray-100 disabled:opacity-50">Próxima</button>
      </div>
    </div>
  </main>

  <script>
    // Credenciais
    const SUPABASE_URL = 'https://wyqdacpheshiqtvdwdke.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_sAI3Y4Aszx_ho4Z_ZSM_WQ_TAMDIe9v';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let paginaAtual = 1;
    const itensPorPagina = 20;

    async function carregarProdutos(pagina = 1) {
      paginaAtual = pagina;
      const tbody = document.getElementById('tabelaProdutos');
      const termoBusca = document.getElementById('searchInput').value.trim();

      tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-500">Buscando...</td></tr>';

      // Cálculo do intervalo de paginação
      const de = (pagina - 1) * itensPorPagina;
      const ate = de + itensPorPagina - 1;

      let query = supabaseClient
        .from('produtos')
        .select('*', { count: 'exact' });

      // Aplica o filtro de busca se houver
      if (termoBusca) {
        query = query.or(`product_name.ilike.%${termoBusca}%,gtin.ilike.%${termoBusca}%`);
      }

      const { data, count, error } = await query.range(de, ate);

      if (error) {
        tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-red-600">Erro: ${error.message}</td></tr>`;
        return;
      }

      if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-500">Nenhum produto encontrado.</td></tr>';
        return;
      }

      // Preenche a tabela
      tbody.innerHTML = data.map(item => `
        <tr class="hover:bg-gray-50">
          <td class="p-4 font-mono text-xs text-blue-600">${item.gtin || '-'}</td>
          <td class="p-4 font-medium text-gray-900">${item.product_name || 'Sem nome'}</td>
          <td class="p-4 text-gray-600">${item.brand || 'N/A'}</td>
          <td class="p-4 text-gray-600">${item.category || 'N/A'}</td>
        </tr>
      `).join('');

      // Atualiza controles de paginação
      const totalPaginas = Math.ceil(count / itensPorPagina);
      document.getElementById('infoPagina').innerText = `Página ${paginaAtual} de ${totalPaginas || 1}`;
      document.getElementById('btnAnterior').disabled = paginaAtual <= 1;
      document.getElementById('btnProxima').disabled = paginaAtual >= totalPaginas;
    }

    function paginaAnterior() {
      if (paginaAtual > 1) carregarProdutos(paginaAtual - 1);
    }

    function proximaPagina() {
      carregarProdutos(paginaAtual + 1);
    }

    // Carrega a primeira página ao abrir a tela
    carregarProdutos(1);
  </script>
</body>
</html>
