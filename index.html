<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kullka - Supply Chain Manager</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- SDK Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans flex flex-col min-h-screen">

  <!-- NAVBAR COM LOGOTIPO CORRIGIDO E ESTRUTURA ORIGINAL -->
  <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-40">
    <div class="container mx-auto px-4 py-3 flex flex-wrap justify-between items-center">
      
      <!-- Logotipo Kullka -->
      <a href="index.html" class="flex items-center space-x-3 group">
        <div class="bg-emerald-600 group-hover:bg-emerald-500 text-white p-2.5 rounded-lg shadow-md transition flex items-center justify-center">
          <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 21h18" opacity="0.9" />
            <path d="M5 21V10l7-5 7 5v11" />
            <path d="M9 14h6" />
            <path d="M9 18h6" />
            <circle cx="12" cy="7.5" r="1" fill="currentColor" />
          </svg>
        </div>
        <div>
          <span class="text-xl font-extrabold tracking-wide text-white block leading-tight">KULLKA</span>
          <span class="text-xs text-emerald-400 font-semibold tracking-wider uppercase block">Supply Chain Manager</span>
        </div>
      </a>

      <!-- Menu Principal Dynamic (Categorias geradas via Script) -->
      <nav id="mainNav" class="hidden md:flex items-center space-x-1 lg:space-x-4 mt-4 md:mt-0 relative"></nav>

      <!-- BOTÃO DE GESTÃO DE PÁGINAS -->
      <div class="flex items-center gap-2">
        <button onclick="abrirGerenciadorPaginas()" class="bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-slate-700 px-3.5 py-2 rounded-lg text-xs font-semibold flex items-center gap-2 transition shadow-sm">
          <i class="fa-solid fa-sliders"></i>
          <span>Gestão de Páginas</span>
        </button>
      </div>

    </div>
  </header>

  <!-- ÁREA DE CONTEÚDO PRINCIPAL (TEMA CLARO ORIGINAL) -->
  <main id="conteudoPrincipal" class="container mx-auto mt-6 p-4 flex-grow">
    <div id="view-conteudo" class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm">
      <h1 id="view-titulo" class="text-2xl font-bold text-gray-800 mb-2">Bem-vindo ao Kullka</h1>
      <p id="view-descricao" class="text-gray-500 text-sm mb-4">Selecione uma opção no menu ou gerencie suas páginas personalizadas.</p>
      <div id="view-corpo" class="mt-4 border-t border-gray-100 pt-4 text-gray-700"></div>
    </div>
  </main>

  <!-- MODAL DE GESTÃO DE PÁGINAS -->
  <div id="modal-gestao-paginas" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white border border-gray-200 rounded-xl max-w-2xl w-full shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
      
      <!-- CABEÇALHO DO MODAL -->
      <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
        <h3 class="text-lg font-bold text-gray-800 flex items-center gap-2">
          <i class="fa-solid fa-sliders text-emerald-600"></i>
          <span>Gerenciador de Páginas</span>
        </h3>
        <button onclick="fecharGerenciadorPaginas()" class="text-gray-400 hover:text-gray-600 transition-colors">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>

      <!-- CORPO DO MODAL -->
      <div class="p-6 overflow-y-auto flex-1 space-y-6">
        
        <!-- FORMULÁRIO -->
        <form id="form-pagina" onsubmit="salvarPagina(event)" class="bg-gray-50 p-4 rounded-lg border border-gray-200 space-y-4">
          <input type="hidden" id="page-slug-original" value="" />
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Título da Página</label>
              <input type="text" id="page-titulo" required placeholder="Ex: Relatório Mensal" class="w-full bg-white border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-800 focus:outline-none focus:border-emerald-500">
            </div>

            <div>
              <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Categoria do Menu</label>
              <select id="page-categoria" required class="w-full bg-white border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-800 focus:outline-none focus:border-emerald-500">
                <option value="Manutenção">Manutenção</option>
                <option value="Gestão Operacional">Gestão Operacional</option>
                <option value="Finanças">Finanças</option>
                <option value="Relatórios">Relatórios</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Ícone (FontAwesome)</label>
              <input type="text" id="page-icone" placeholder="fa-file-lines" class="w-full bg-white border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-800 focus:outline-none focus:border-emerald-500">
            </div>

            <div>
              <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Identificador (Slug)</label>
              <input type="text" id="page-slug" required placeholder="relatorio-mensal" class="w-full bg-white border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-800 focus:outline-none focus:border-emerald-500">
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Conteúdo HTML</label>
            <textarea id="page-conteudo" rows="3" placeholder="<p>Conteúdo da sua página personalizada...</p>" class="w-full bg-white border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-800 focus:outline-none focus:border-emerald-500 font-mono"></textarea>
          </div>

          <div class="flex justify-end gap-2">
            <button type="button" onclick="limparFormularioPagina()" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-xs font-semibold text-gray-700 rounded-lg transition-colors">Cancelar</button>
            <button type="submit" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-xs font-bold text-white rounded-lg transition-colors flex items-center gap-1">
              <i class="fa-solid fa-plus"></i>
              <span>Salvar Página</span>
            </button>
          </div>
        </form>

        <!-- TABELA DE PÁGINAS -->
        <div>
          <h4 class="text-sm font-bold text-gray-700 uppercase tracking-wider mb-3">Páginas Cadastradas</h4>
          <div class="bg-white border border-gray-200 rounded-lg overflow-hidden shadow-sm">
            <table class="w-full text-left border-collapse text-sm">
              <thead>
                <tr class="bg-gray-50 border-b border-gray-200 text-gray-500 text-xs uppercase">
                  <th class="p-3">Título</th>
                  <th class="p-3">Categoria</th>
                  <th class="p-3 text-right">Ações</th>
                </tr>
              </thead>
              <tbody id="tabela-paginas-body" class="divide-y divide-gray-100"></tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    
    // 1. INICIALIZAÇÃO DO SUPABASE
    const SUPABASE_URL = 'https://wyqdacpheshiqtvdwdke.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_sAI3Y4Aszx_ho4Z_ZSM_WQ_TAMDIe9v'; // Coloque a sua chave public/anon do Supabase

    // Define o cliente globalmente para as páginas dinâmicas consultarem
    window.supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 2. CÓDIGO DA APLICAÇÃO (MANTIDO)
    const STORAGE_KEY = 'kullka_paginas_app';

    const categoriasConfig = [
      { nome: 'Manutenção', icone: 'fa-wrench' },
      { nome: 'Gestão Operacional', icone: 'fa-boxes-packing' },
      { nome: 'Finanças', icone: 'fa-wallet' },
      { nome: 'Relatórios', icone: 'fa-chart-line' }
    ];   
    
    
    const STORAGE_KEY = 'kullka_paginas_app';

    const categoriasConfig = [
      { nome: 'Manutenção', icone: 'fa-wrench' },
      { nome: 'Gestão Operacional', icone: 'fa-boxes-packing' },
      { nome: 'Finanças', icone: 'fa-wallet' },
      { nome: 'Relatórios', icone: 'fa-chart-line' }
    ];

    const paginasIniciais = [
      { slug: 'cadastro-produtos', titulo: 'Cadastro de Produtos', categoria: 'Manutenção', icone: 'fa-tags', conteudo: '<p>Tela de cadastro de produtos.</p>' },
      { slug: 'layout', titulo: 'Layout', categoria: 'Manutenção', icone: 'fa-map-location-dot', conteudo: '<p>Visão do Layout do Armazém.</p>' },
      { slug: 'editar-layout', titulo: 'Editar Layout', categoria: 'Manutenção', icone: 'fa-pen-to-square', conteudo: '<p>Editor visual de Layout.</p>' }
    ];

    function obterPaginas() {
      const salvas = localStorage.getItem(STORAGE_KEY);
      if (!salvas) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(paginasIniciais));
        return paginasIniciais;
      }
      return JSON.parse(salvas);
    }

    function salvarListaPaginas(lista) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(lista));
      atualizarMenuEPaginas();
    }

    function renderizarMenuDinamico() {
      const mainNav = document.getElementById('mainNav');
      if (!mainNav) return;
      mainNav.innerHTML = '';

      const paginas = obterPaginas();

      categoriasConfig.forEach(cat => {
        const paginasCategoria = paginas.filter(p => p.categoria === cat.nome);
        
        const groupDiv = document.createElement('div');
        groupDiv.className = 'relative group';

        const button = document.createElement('button');
        button.className = 'flex items-center gap-2 px-3 py-2 text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 rounded-lg transition-colors';
        button.innerHTML = `
          <i class="fa-solid ${cat.icone} text-emerald-400"></i>
          <span>${cat.nome}</span>
          <i class="fa-solid fa-chevron-down text-xs opacity-50"></i>
        `;

        const dropdown = document.createElement('div');
        dropdown.className = 'hidden group-hover:block absolute left-0 mt-0 w-56 bg-slate-900 border border-slate-800 rounded-lg shadow-2xl py-2 z-50';

        if (paginasCategoria.length === 0) {
          dropdown.innerHTML = '<span class="block px-4 py-2 text-xs text-slate-500">Nenhuma página</span>';
        } else {
          paginasCategoria.forEach(pag => {
            const item = document.createElement('a');
            item.href = `#${pag.slug}`;
            item.className = 'flex items-center gap-2 px-4 py-2.5 text-sm text-slate-300 hover:bg-slate-800 hover:text-white transition-colors cursor-pointer';
            item.innerHTML = `<i class="fa-solid ${pag.icone || 'fa-file'} text-emerald-400 w-4"></i> <span>${pag.titulo}</span>`;
            
            item.addEventListener('click', (e) => {
              e.preventDefault();
              navegarPara(pag.slug);
            });

            dropdown.appendChild(item);
          });
        }

        groupDiv.appendChild(button);
        groupDiv.appendChild(dropdown);
        mainNav.appendChild(groupDiv);
      });
    }

    function abrirGerenciadorPaginas() {
      document.getElementById('modal-gestao-paginas').classList.remove('hidden');
      renderizarTabelaGerenciador();
    }

    function fecharGerenciadorPaginas() {
      document.getElementById('modal-gestao-paginas').classList.add('hidden');
      limparFormularioPagina();
    }

    function renderizarTabelaGerenciador() {
      const tbody = document.getElementById('tabela-paginas-body');
      tbody.innerHTML = '';

      const paginas = obterPaginas();

      if (paginas.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" class="p-4 text-center text-gray-400 text-xs">Nenhuma página cadastrada.</td></tr>';
        return;
      }

      paginas.forEach(pag => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-gray-50 transition-colors';
        tr.innerHTML = `
          <td class="p-3 font-semibold text-gray-800 flex items-center gap-2">
            <i class="fa-solid ${pag.icone || 'fa-file'} text-emerald-600"></i>
            <span>${pag.titulo}</span>
          </td>
          <td class="p-3 text-gray-500">${pag.categoria}</td>
          <td class="p-3 text-right space-x-2">
            <button onclick="editarPagina('${pag.slug}')" class="text-blue-600 hover:text-blue-800 p-1 transition-colors" title="Editar">
              <i class="fa-solid fa-pen"></i>
            </button>
            <button onclick="excluirPagina('${pag.slug}')" class="text-rose-600 hover:text-rose-800 p-1 transition-colors" title="Excluir">
              <i class="fa-solid fa-trash"></i>
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function salvarPagina(e) {
      e.preventDefault();

      const slugOriginal = document.getElementById('page-slug-original').value;
      const titulo = document.getElementById('page-titulo').value.trim();
      const categoria = document.getElementById('page-categoria').value;
      const icone = document.getElementById('page-icone').value.trim() || 'fa-file';
      const slug = document.getElementById('page-slug').value.trim().toLowerCase().replace(/\s+/g, '-');
      const conteudo = document.getElementById('page-conteudo').value;

      let paginas = obterPaginas();

      if (slugOriginal) {
        paginas = paginas.map(p => p.slug === slugOriginal ? { slug, titulo, categoria, icone, conteudo } : p);
      } else {
        if (paginas.some(p => p.slug === slug)) {
          alert('Já existe uma página com este Identificador (Slug). Use outro.');
          return;
        }
        paginas.push({ slug, titulo, categoria, icone, conteudo });
      }

      salvarListaPaginas(paginas);
      limparFormularioPagina();
      renderizarTabelaGerenciador();
    }

    function editarPagina(slug) {
      const paginas = obterPaginas();
      const pag = paginas.find(p => p.slug === slug);
      if (!pag) return;

      document.getElementById('page-slug-original').value = pag.slug;
      document.getElementById('page-titulo').value = pag.titulo;
      document.getElementById('page-categoria').value = pag.categoria;
      document.getElementById('page-icone').value = pag.icone;
      document.getElementById('page-slug').value = pag.slug;
      document.getElementById('page-conteudo').value = pag.conteudo || '';
    }

    function excluirPagina(slug) {
      if (!confirm(`Tem certeza que deseja excluir a página "${slug}"?`)) return;

      let paginas = obterPaginas();
      paginas = paginas.filter(p => p.slug !== slug);
      
      salvarListaPaginas(paginas);
      renderizarTabelaGerenciador();
    }

    function limparFormularioPagina() {
      document.getElementById('form-pagina').reset();
      document.getElementById('page-slug-original').value = '';
    }

    function navegarPara(slug) {
      const paginas = obterPaginas();
      const pag = paginas.find(p => p.slug === slug);

      if (pag) {
        document.getElementById('view-titulo').innerText = pag.titulo;
        document.getElementById('view-descricao').innerText = `Categoria: ${pag.categoria}`;
        document.getElementById('view-corpo').innerHTML = pag.conteudo || '<p class="text-gray-400">Página sem conteúdo.</p>';
      }
    }

    function atualizarMenuEPaginas() {
      renderizarMenuDinamico();
    }

    document.addEventListener('DOMContentLoaded', () => {
      atualizarMenuEPaginas();
    });
  </script>
</body>
</html>
