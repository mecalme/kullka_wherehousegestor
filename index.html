<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kullka - Supply Chain Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- NAVBAR COM AS 4 CATEGORIAS FIXAS -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-40 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        
        <!-- LOGO -->
        <div class="flex items-center gap-3 cursor-pointer" onclick="navegarPara('dashboard')">
          <div class="bg-emerald-500 p-2 rounded-lg text-slate-900 font-black text-xl">K</div>
          <span class="font-bold text-lg tracking-wide text-white">Kullka <span class="text-emerald-400 text-xs font-normal">Gestor</span></span>
        </div>

        <!-- MENU PRINCIPAL COM 4 CATEGORIAS FIXAS -->
        <nav class="hidden md:flex items-center space-x-1">
          
          <!-- 1. Manutenção -->
          <div class="relative group">
            <button class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-700 rounded-md transition-colors">
              <i class="fa-solid fa-wrench text-emerald-400"></i>
              <span>Manutenção</span>
              <i class="fa-solid fa-chevron-down text-xs opacity-60"></i>
            </button>
            <div id="dropdown-manutencao" class="hidden group-hover:block absolute left-0 mt-0 w-56 bg-slate-800 border border-slate-700 rounded-md shadow-xl py-2 z-50">
              <!-- Submenus inseridos dinamicamente pelo JS -->
            </div>
          </div>

          <!-- 2. Gestão Operacional -->
          <div class="relative group">
            <button class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-700 rounded-md transition-colors">
              <i class="fa-solid fa-boxes-packing text-emerald-400"></i>
              <span>Gestão Operacional</span>
              <i class="fa-solid fa-chevron-down text-xs opacity-60"></i>
            </button>
            <div id="dropdown-gestao" class="hidden group-hover:block absolute left-0 mt-0 w-56 bg-slate-800 border border-slate-700 rounded-md shadow-xl py-2 z-50">
              <!-- Submenus inseridos dinamicamente pelo JS -->
            </div>
          </div>

          <!-- 3. Finanças -->
          <div class="relative group">
            <button class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-700 rounded-md transition-colors">
              <i class="fa-solid fa-wallet text-emerald-400"></i>
              <span>Finanças</span>
              <i class="fa-solid fa-chevron-down text-xs opacity-60"></i>
            </button>
            <div id="dropdown-financas" class="hidden group-hover:block absolute left-0 mt-0 w-56 bg-slate-800 border border-slate-700 rounded-md shadow-xl py-2 z-50">
              <!-- Submenus inseridos dinamicamente pelo JS -->
            </div>
          </div>

          <!-- 4. Relatórios -->
          <div class="relative group">
            <button class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-700 rounded-md transition-colors">
              <i class="fa-solid fa-chart-line text-emerald-400"></i>
              <span>Relatórios</span>
              <i class="fa-solid fa-chevron-down text-xs opacity-60"></i>
            </button>
            <div id="dropdown-relatorios" class="hidden group-hover:block absolute left-0 mt-0 w-56 bg-slate-800 border border-slate-700 rounded-md shadow-xl py-2 z-50">
              <!-- Submenus inseridos dinamicamente pelo JS -->
            </div>
          </div>

        </nav>

        <!-- AÇÕES / CONFIGURAÇÕES DE PÁGINAS -->
        <div class="flex items-center gap-2">
          <button onclick="navegarPara('gestao-paginas')" class="px-3 py-2 bg-slate-700 hover:bg-slate-600 text-xs font-semibold rounded-md flex items-center gap-1.5 transition-colors">
            <i class="fa-solid fa-gear text-emerald-400"></i>
            <span>Gestão de Páginas</span>
          </button>
        </div>

      </div>
    </div>
  </header>

  <!-- ÁREA DE CONTEÚDO DINÂMICO DA APLICAÇÃO -->
  <main id="app-container" class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
    <!-- As visões das páginas carregam aqui sem recarregar a tela -->
  </main>

  <script>
    // Inicialização do Supabase (Coloque suas chaves se necessário)
    const SUPABASE_URL = 'SUA_SUPABASE_URL';
    const SUPABASE_KEY = 'SUA_SUPABASE_KEY';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Mapeamento das páginas fixas por categoria no banco/estado da aplicação
    async function renderizarMenuCategorizado() {
      const dropdowns = {
        'Manutenção': document.getElementById('dropdown-manutencao'),
        'Gestão Operacional': document.getElementById('dropdown-gestao'),
        'Finanças': document.getElementById('dropdown-financas'),
        'Relatórios': document.getElementById('dropdown-relatorios')
      };

      // Limpa dropdowns
      Object.values(dropdowns).forEach(el => { if(el) el.innerHTML = ''; });

      // Busca paginas cadastradas no Supabase
      const { data: paginas, error } = await supabaseClient
        .from('paginas')
        .select('*')
        .eq('ativo', true)
        .order('titulo', { ascending: true });

      if (error || !paginas) {
        console.warn('Usando estrutura local por falta de conexão com Supabase.');
        return;
      }

      paginas.forEach(pag => {
        const target = dropdowns[pag.categoria];
        if (target) {
          const item = document.createElement('a');
          item.href = `#${pag.slug}`;
          item.className = 'flex items-center gap-2 px-4 py-2.5 text-sm text-slate-300 hover:bg-slate-700 hover:text-white transition-colors';
          item.innerHTML = `<i class="${pag.icone || 'fa-solid fa-file'} text-emerald-400 w-4"></i> <span>${pag.titulo}</span>`;
          
          item.addEventListener('click', (e) => {
            e.preventDefault();
            navegarPara(pag.slug);
          });

          target.appendChild(item);
        }
      });

      // Trata dropdowns vazios
      Object.keys(dropdowns).forEach(key => {
        const target = dropdowns[key];
        if (target && target.children.length === 0) {
          target.innerHTML = '<span class="block px-4 py-2 text-xs text-slate-500">Nenhum subitem</span>';
        }
      });
    }

    function navegarPara(slug) {
      console.log('Navegando para:', slug);
      // Mantida a lógica original de troca de views do SPA
    }

    // Executa ao carregar a página
    document.addEventListener('DOMContentLoaded', () => {
      renderizarMenuCategorizado();
    });
  </script>
</body>
</html>
