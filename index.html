<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kullka - Gestão de Layout & Endereçamento Logístico</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .card { border-radius: 8px; }
    .badge-zona { font-size: 0.85rem; padding: 5px 10px; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="#"><i class="fas fa-warehouse me-2"></i>KULLKA</a>
    </div>
  </nav>

  <!-- Conteúdo Principal -->
  <div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h3 class="fw-bold mb-1"><i class="fas fa-map-marked-alt text-primary me-2"></i>Gestão de Layout & Endereçamento Logístico</h3>
        <p class="text-muted mb-0">Configure a localização física/lógica do seu armazém ou loja.</p>
      </div>
      <div>
        <button class="btn btn-success me-2" id="btnOpenNewModal">
          <i class="fas fa-plus me-1"></i> Nova Localização
        </button>
        <button class="btn btn-dark"><i class="fas fa-sitemap me-1"></i> Gerador em Lote</button>
      </div>
    </div>

    <!-- Tabela de Endereços Cadastrados -->
    <div class="card shadow-sm">
      <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
        <h5 class="mb-0 fw-bold">Estrutura de Armazenamento Cadastrada</h5>
        <span class="badge bg-success-subtle text-success border border-success-subtle rounded-pill" id="totalCount">0 Endereços</span>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>CÓDIGO / TAG</th>
                <th>ZONA PRINCIPAL</th>
                <th>SUBZONA</th>
                <th>CORREDOR</th>
                <th>COLUNA / PRATELEIRA</th>
                <th>NÍVEL / ALTURA</th>
                <th class="text-center">AÇÕES</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <!-- Renderizado via JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal para Criar / Editar Localização -->
  <div class="modal fade" id="modalLocation" tabindex="-1" aria-labelledby="modalLocationLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="modalLocationLabel">Nova Localização</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="formLocation">
            <div class="mb-3">
              <label for="selectZona" class="form-label">Zona Principal</label>
              <select class="form-select" id="selectZona" required>
                <option value="DOCA">DOCA</option>
                <option value="DEP">DEP (Depósito)</option>
                <option value="LOJA">LOJA</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="inputSubzona" class="form-label">Subzona</label>
              <input type="text" class="form-control" id="inputSubzona" placeholder="Ex: Paletes, Recebimento, Mercearia" required>
            </div>
            <div class="row">
              <div class="col-md-4 mb-3">
                <label for="inputCorredor" class="form-label">Corredor</label>
                <input type="text" class="form-control" id="inputCorredor" placeholder="Ex: Corredor 01">
              </div>
              <div class="col-md-4 mb-3">
                <label for="inputColuna" class="form-label">Coluna</label>
                <input type="text" class="form-control" id="inputColuna" placeholder="Ex: Coluna 01">
              </div>
              <div class="col-md-4 mb-3">
                <label for="inputNivel" class="form-label">Nível</label>
                <input type="text" class="form-control" id="inputNivel" placeholder="Ex: Nível 1">
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" id="btnSaveLocation">Salvar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts: Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Estado inicial dos dados
    let locationsList = [
      { id: 1, codigo: 'DOCA-01', zona: 'DOCA', subzona: 'Recebimento', corredor: '-', coluna: '-', nivel: '-' },
      { id: 2, codigo: 'DEP-C01-COL01-N1', zona: 'DEP', subzona: 'Paletes', corredor: 'Corredor 01', coluna: 'Coluna 01', nivel: 'Nível 1' },
      { id: 3, codigo: 'LOJA-SET01-C03-N2', zona: 'LOJA', subzona: 'Gôndolas', corredor: 'Corredor 03', coluna: 'Coluna 02', nivel: 'Nível 2' },
      { id: 4, codigo: 'LOJA-MERCEARIA-C12-COL1-N1', zona: 'LOJA', subzona: 'Mercearia', corredor: 'Corredor 12', coluna: 'Coluna 1', nivel: 'Nível 1' }
    ];

    let editIndex = null;
    const modalElement = new bootstrap.Modal(document.getElementById('modalLocation'));

    // Renderiza a tabela
    function renderTable() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      locationsList.forEach((item, index) => {
        const tr = document.createElement('tr');
        
        // Cor do Badge da Zona
        let badgeClass = 'bg-secondary';
        if (item.zona === 'DOCA') badgeClass = 'bg-warning text-dark';
        if (item.zona === 'DEP') badgeClass = 'bg-primary';
        if (item.zona === 'LOJA') badgeClass = 'bg-success';

        tr.innerHTML = `
          <td class="fw-bold">${item.codigo}</td>
          <td><span class="badge ${badgeClass} badge-zona">${item.zona}</span></td>
          <td>${item.subzona || '-'}</td>
          <td>${item.corredor || '-'}</td>
          <td>${item.coluna || '-'}</td>
          <td>${item.nivel || '-'}</td>
          <td class="text-center">
            <button class="btn btn-sm btn-outline-primary me-1" onclick="openEditModal(${index})" title="Editar">
              <i class="fas fa-edit"></i>
            </button>
            <button class="btn btn-sm btn-outline-danger" onclick="deleteLocation(${index})" title="Excluir">
              <i class="fas fa-trash"></i>
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('totalCount').innerText = `${locationsList.length} Endereços`;
    }

    // Gerador automático de Tag/Código simples
    function generateCode(zona, subzona, corredor, coluna, nivel) {
      let code = zona;
      if (corredor && corredor !== '-') code += `-${corredor.replace(/\s+/g, '').toUpperCase()}`;
      if (coluna && coluna !== '-') code += `-${coluna.replace(/\s+/g, '').toUpperCase()}`;
      if (nivel && nivel !== '-') code += `-${nivel.replace(/\s+/g, '').toUpperCase()}`;
      if (code === zona && subzona) code += `-${subzona.substring(0, 3).toUpperCase()}-01`;
      return code;
    }

    // Ação do Botão "Nova Localização"
    document.getElementById('btnOpenNewModal').addEventListener('click', () => {
      editIndex = null;
      document.getElementById('formLocation').reset();
      document.getElementById('modalLocationLabel').innerText = 'Nova Localização';
      document.getElementById('btnSaveLocation').innerText = 'Salvar';
      modalElement.show();
    });

    // Abrir Modal no Modo Edição
    function openEditModal(index) {
      editIndex = index;
      const item = locationsList[index];

      document.getElementById('selectZona').value = item.zona;
      document.getElementById('inputSubzona').value = item.subzona !== '-' ? item.subzona : '';
      document.getElementById('inputCorredor').value = item.corredor !== '-' ? item.corredor : '';
      document.getElementById('inputColuna').value = item.coluna !== '-' ? item.coluna : '';
      document.getElementById('inputNivel').value = item.nivel !== '-' ? item.nivel : '';

      document.getElementById('modalLocationLabel').innerText = 'Editar Localização';
      document.getElementById('btnSaveLocation').innerText = 'Atualizar';
      modalElement.show();
    }

    // Salvar (Novo ou Edição)
    document.getElementById('btnSaveLocation').addEventListener('click', () => {
      const zona = document.getElementById('selectZona').value;
      const subzona = document.getElementById('inputSubzona').value || '-';
      const corredor = document.getElementById('inputCorredor').value || '-';
      const coluna = document.getElementById('inputColuna').value || '-';
      const nivel = document.getElementById('inputNivel').value || '-';
      
      const codigo = generateCode(zona, subzona, corredor, coluna, nivel);

      const newItem = {
        id: editIndex !== null ? locationsList[editIndex].id : Date.now(),
        codigo: codigo,
        zona: zona,
        subzona: subzona,
        corredor: corredor,
        coluna: coluna,
        nivel: nivel
      };

      if (editIndex !== null) {
        locationsList[editIndex] = newItem;
      } else {
        locationsList.push(newItem);
      }

      renderTable();
      modalElement.hide();
    });

    // Excluir registro
    function deleteLocation(index) {
      if (confirm('Tem certeza que deseja remover esta localização?')) {
        locationsList.splice(index, 1);
        renderTable();
      }
    }

    // Inicialização
    renderTable();
  </script>
</body>
</html>
