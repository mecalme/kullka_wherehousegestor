<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kullka - Supply Chain Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- NAVBAR COM AS 4 CATEGORIAS FIXAS -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-40 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        
        <!-- LOGO -->
        <div class="flex items-center gap-3 cursor-pointer" onclick="navegarPara('dashboard')">
          <div class="bg-emerald-500 p-2 rounded-lg text-slate-900 font-black text-xl">K</div>
          <span class="font-bold text-lg tracking-wide text-white">Kullka <span class="text-emerald-400 text-xs font-normal">Gestor</span></span>
        </div>

        <!-- MENU PRINCIPAL COM 4 CATEGORIAS FIXAS -->
        <nav class="hidden md:flex items-center space-x-1">
          <div class="relative group">
            <button class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-700 rounded-md transition-colors">
              <i class="fa-solid fa-wrench text-emerald-400"></i>
              <span>Manutenção</span>
              <i class="fa-solid fa-chevron-down text-xs opacity-60"></i>
            </button>
            <div id="dropdown-manutencao" class="hidden group-hover:block absolute left-0 mt-0 w-56 bg-slate-800 border border-slate-700 rounded-md shadow-xl py-2 z-50"></div>
          </div>

          <div class="relative group">
            <button class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-700 rounded-md transition-colors">
              <i class="fa-solid fa-boxes-packing text-emerald-400"></i>
              <span>Gestão Operacional</span>
              <i class="fa-solid fa-chevron-down text-xs opacity-60"></i>
            </button>
            <div id="dropdown-gestao" class="hidden group-hover:block absolute left-0 mt-0 w-56 bg-slate-800 border border-slate-700 rounded-md shadow-xl py-2 z-50"></div>
          </div>

          <div class="relative group">
            <button class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-700 rounded-md transition-colors">
              <i class="fa-solid fa-wallet text-emerald-400"></i>
              <span>Finanças</span>
              <i class="fa-solid fa-chevron-down text-xs opacity-60"></i>
            </button>
            <div id="dropdown-financas" class="hidden group-hover:block absolute left-0 mt-0 w-56 bg-slate-800 border border-slate-700 rounded-md shadow-xl py-2 z-50"></div>
          </div>

          <div class="relative group">
            <button class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-700 rounded-md transition-colors">
              <i class="fa-solid fa-chart-line text-emerald-400"></i>
              <span>Relatórios</span>
              <i class="fa-solid fa-chevron-down text-xs opacity-60"></i>
            </button>
            <div id="dropdown-relatorios" class="hidden group-hover:block absolute left-0 mt-0 w-56 bg-slate-800 border border-slate-700 rounded-md shadow-xl py-2 z-50"></div>
          </div>
        </nav>

        <!-- BOTÃO ACIONADOR DO GERENCIADOR DE PÁGINAS -->
        <div class="flex items-center gap-2">
          <button onclick="abrirGerenciadorPaginas()" class="px-3 py-2 bg-emerald-600 hover:bg-emerald-500 text-slate-900 font-bold text-xs rounded-md flex items-center gap-1.5 transition-colors">
            <i class="fa-solid fa-sliders"></i>
            <span>Gestão de Páginas</span>
          </button>
        </div>

      </div>
    </div>
  </header>

  <!-- ÁREA DE CONTEÚDO PRINCIPAL -->
  <main id="app-container" class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
    <div id="view-conteudo" class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl">
      <h1 id="view-titulo" class="text-2xl font-bold text-white mb-2">Bem-vindo ao Kullka</h1>
      <p id="view-descricao" class="text-slate-400 text-sm mb-4">Selecione uma opção no menu ou gerencie suas páginas personalizadas.</p>
      <div id="view-corpo" class="mt-4"></div>
    </div>
  </main>

  <!-- MODAL DO GERENCIADOR DE PÁGINAS (CORRIGIDO E REPARADO) -->
  <div id="modal-gestao-paginas" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-xl max-w-2xl w-full shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
      
      <!-- CABEÇALHO DO MODAL -->
      <div class="px-6 py-4 border-b border-slate-700 flex justify-between items-center bg-slate-800/50">
        <h3 class="text-lg font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-sliders text-emerald-400"></i>
          <span>Gerenciador de Páginas</span>
        </h3>
        <button onclick="fecharGerenciadorPaginas()" class="text-slate-400 hover:text-white transition-colors">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>

      <!-- CORPO DO MODAL -->
      <div class="p-6 overflow-y-auto flex-1 space-y-6">
        
        <!-- FORMULÁRIO DE CRIAÇÃO/EDIÇÃO -->
        <form id="form-pagina" onsubmit="salvarPagina(event)" class="bg-slate-900/60 p-4 rounded-lg border border-slate-700 space-y-4">
          <input type="hidden" id="page-slug-original" value="" />
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Título da Página</label>
              <input type="text" id="page-titulo" required placeholder="Ex: Relatório Mensal" class="w-full bg-slate-800 border border-slate-700 rounded-md px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Categoria do Menu</label>
              <select id="page-categoria" required class="w-full bg-slate-800 border border-slate-700 rounded-md px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                <option value="Manutenção">Manutenção</option>
                <option value="Gestão Operacional">Gestão Operacional</option>
                <option value="Finanças">Finanças</option>
                <option value="Relatórios">Relatórios</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Ícone (FontAwesome)</label>
              <input type="text" id="page-icone" placeholder="fa-file-lines" class="w-full bg-slate-800 border border-slate-700 rounded-md px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Identificador (Slug)</label>
              <input type="text" id="page-slug" required placeholder="relatorio-mensal" class="w-full bg-slate-800 border border-slate-700 rounded-md px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Conteúdo HTML da Página</label>
            <textarea id="page-conteudo" rows="3" placeholder="<p>Conteúdo da sua página personalizada...</p>" class="w-full bg-slate-800 border border-slate-700 rounded-md px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500 font-mono"></textarea>
          </div>

          <div class="flex justify-end gap-2">
            <button type="button" onclick="limparFormularioPagina()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-300 rounded-md transition-colors">Cancelar</button>
            <button type="submit" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-xs font-bold text-slate-900 rounded-md transition-colors flex items-center gap-1">
              <i class="fa-solid fa-plus"></i>
              <span>Salvar Página</span>
            </button>
          </div>
        </form>

        <!-- TABELA DE PÁGINAS CADASTRADAS -->
        <div>
          <h4 class="text-sm font-bold text-slate-300 uppercase tracking-wider mb-3">Páginas Cadastradas</h4>
          <div class="bg-slate-900 border border-slate-700 rounded-lg overflow-hidden">
            <table class="w-full text-left border-collapse text-sm">
              <thead>
                <tr class="bg-slate-800/80 border-b border-slate-700 text-slate-400 text-xs uppercase">
                  <th class="p-3">Título</th>
                  <th class="p-3">Categoria</th>
                  <th class="p-3 text-right">Ações</th>
                </tr>
              </thead>
              <tbody id="tabela-paginas-body" class="divide-y divide-slate-800">
                <!-- Linhas inseridas dinamicamente via JS -->
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    // 1. ESTRUTURA INICIAL E ARMAZENAMENTO LOCAL
    const STORAGE_KEY = 'kullka_paginas_app';

    const paginasIniciais = [
      { slug: 'cadastro-produtos', titulo: 'Cadastro de Produtos', categoria: 'Manutenção', icone: 'fa-tags', conteudo: '<p>Tela de cadastro de produtos cadastrada.</p>' },
      { slug: 'layout', titulo: 'Layout', categoria: 'Manutenção', icone: 'fa-map-location-dot', conteudo: '<p>Visão do Layout do Armazém.</p>' },
      { slug: 'editar-layout', titulo: 'Editar Layout', categoria: 'Manutenção', icone: 'fa-pen-to-square', conteudo: '<p>Editor visual de Layout.</p>' }
    ];

    function obterPaginas() {
      const salvas = localStorage.getItem(STORAGE_KEY);
      if (!salvas) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(paginasIniciais));
        return paginasIniciais;
      }
      return JSON.parse(salvas);
    }

    function salvarListaPaginas(lista) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(lista));
      atualizarMenuEPaginas();
    }

    // 2. RENDERIZAÇÃO DO MENU FIXO COM OS SUBMENUS DINÂMICOS
    function renderizarMenu() {
      const dropdowns = {
        'Manutenção': document.getElementById('dropdown-manutencao'),
        'Gestão Operacional': document.getElementById('dropdown-gestao'),
        'Finanças': document.getElementById('dropdown-financas'),
        'Relatórios': document.getElementById('dropdown-relatorios')
      };

      Object.values(dropdowns).forEach(el => { if(el) el.innerHTML = ''; });

      const paginas = obterPaginas();

      paginas.forEach(pag => {
        const target = dropdowns[pag.categoria];
        if (target) {
          const item = document.createElement('a');
          item.href = `#${pag.slug}`;
          item.className = 'flex items-center gap-2 px-4 py-2.5 text-sm text-slate-300 hover:bg-slate-700 hover:text-white transition-colors cursor-pointer';
          item.innerHTML = `<i class="fa-solid ${pag.icone || 'fa-file'} text-emerald-400 w-4"></i> <span>${pag.titulo}</span>`;
          
          item.addEventListener('click', (e) => {
            e.preventDefault();
            navegarPara(pag.slug);
          });

          target.appendChild(item);
        }
      });

      Object.keys(dropdowns).forEach(key => {
        const target = dropdowns[key];
        if (target && target.children.length === 0) {
          target.innerHTML = '<span class="block px-4 py-2 text-xs text-slate-500">Nenhuma página</span>';
        }
      });
    }

    // 3. GERENCIAMENTO DE PÁGINAS (CRIAR, EDITAR, DELETAR)
    function abrirGerenciadorPaginas() {
      document.getElementById('modal-gestao-paginas').classList.remove('hidden');
      renderizarTabelaGerenciador();
    }

    function fecharGerenciadorPaginas() {
      document.getElementById('modal-gestao-paginas').classList.add('hidden');
      limparFormularioPagina();
    }

    function renderizarTabelaGerenciador() {
      const tbody = document.getElementById('tabela-paginas-body');
      tbody.innerHTML = '';

      const paginas = obterPaginas();

      if (paginas.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" class="p-4 text-center text-slate-500 text-xs">Nenhuma página cadastrada.</td></tr>';
        return;
      }

      paginas.forEach(pag => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-800/40 transition-colors';
        tr.innerHTML = `
          <td class="p-3 font-semibold text-white flex items-center gap-2">
            <i class="fa-solid ${pag.icone || 'fa-file'} text-emerald-400"></i>
            <span>${pag.titulo}</span>
          </td>
          <td class="p-3 text-slate-400">${pag.categoria}</td>
          <td class="p-3 text-right space-x-2">
            <button onclick="editarPagina('${pag.slug}')" class="text-blue-400 hover:text-blue-300 p-1 transition-colors" title="Editar">
              <i class="fa-solid fa-pen"></i>
            </button>
            <button onclick="excluirPagina('${pag.slug}')" class="text-rose-400 hover:text-rose-300 p-1 transition-colors" title="Excluir">
              <i class="fa-solid fa-trash"></i>
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function salvarPagina(e) {
      e.preventDefault();

      const slugOriginal = document.getElementById('page-slug-original').value;
      const titulo = document.getElementById('page-titulo').value.trim();
      const categoria = document.getElementById('page-categoria').value;
      const icone = document.getElementById('page-icone').value.trim() || 'fa-file';
      const slug = document.getElementById('page-slug').value.trim().toLowerCase().replace(/\s+/g, '-');
      const conteudo = document.getElementById('page-conteudo').value;

      let paginas = obterPaginas();

      if (slugOriginal) {
        // Edição
        paginas = paginas.map(p => p.slug === slugOriginal ? { slug, titulo, categoria, icone, conteudo } : p);
      } else {
        // Criação (impede slug duplicado)
        if (paginas.some(p => p.slug === slug)) {
          alert('Já existe uma página com este Identificador (Slug). Use outro.');
          return;
        }
        paginas.push({ slug, titulo, categoria, icone, conteudo });
      }

      salvarListaPaginas(paginas);
      limparFormularioPagina();
      renderizarTabelaGerenciador();
    }

    function editarPagina(slug) {
      const paginas = obterPaginas();
      const pag = paginas.find(p => p.slug === slug);
      if (!pag) return;

      document.getElementById('page-slug-original').value = pag.slug;
      document.getElementById('page-titulo').value = pag.titulo;
      document.getElementById('page-categoria').value = pag.categoria;
      document.getElementById('page-icone').value = pag.icone;
      document.getElementById('page-slug').value = pag.slug;
      document.getElementById('page-conteudo').value = pag.conteudo || '';
    }

    function excluirPagina(slug) {
      if (!confirm(`Tem certeza que deseja excluir a página "${slug}"?`)) return;

      let paginas = obterPaginas();
      paginas = paginas.filter(p => p.slug !== slug);
      
      salvarListaPaginas(paginas);
      renderizarTabelaGerenciador();
    }

    function limparFormularioPagina() {
      document.getElementById('form-pagina').reset();
      document.getElementById('page-slug-original').value = '';
    }

    // 4. NAVEGAÇÃO ENTRE AS TELAS
    function navegarPara(slug) {
      const paginas = obterPaginas();
      const pag = paginas.find(p => p.slug === slug);

      if (pag) {
        document.getElementById('view-titulo').innerText = pag.titulo;
        document.getElementById('view-descricao').innerText = `Categoria: ${pag.categoria}`;
        document.getElementById('view-corpo').innerHTML = pag.conteudo || '<p class="text-slate-500">Página sem conteúdo.</p>';
      }
    }

    function atualizarMenuEPaginas() {
      renderizarMenu();
    }

    // Inicialização ao carregar a página
    document.addEventListener('DOMContentLoaded', () => {
      atualizarMenuEPaginas();
    });
  </script>
</body>
</html>
